[project]
name = "insurance-underwriting-ui"
version = "0.1.0"
description = "Streamlit console for the insurance agentic underwriting platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.12.0",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.40",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
